spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/smartqueue?options=-c%20TimeZone=Asia/Kolkata
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    hibernate:
      ddl-auto: update

    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always